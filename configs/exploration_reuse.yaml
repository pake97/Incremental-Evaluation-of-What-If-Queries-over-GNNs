# Experiment 4 — exploration reuse: whole traces under the three rungs
# (scratch / incremental-no-reuse / incremental+reuse), sweeping trace shape.
# Headline: reuse benefit vs prefix-sharing / branching.
datasets: [finbench]
archs: [rgcn, hgat]
task: nodelabel
layers: 2
n_states: 40
max_depth: 8
share_rates: [0.0, 0.25, 0.5, 0.75]   # the prefix-sharing / re-convergence knob
backtrack_rates: [0.1, 0.4]
branchings: [2, 4]
feature_frac: 0.5                     # intervention mix
cohort_size: 32                       # feature-Δ locality
topo_edits: 8                         # topo-Δ locality
max_caches: 64                        # materialization budget (reuse rung)
check_every: 5                        # untimed exactness spot check cadence
