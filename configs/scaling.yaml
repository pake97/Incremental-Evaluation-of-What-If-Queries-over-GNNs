# Scaling experiments with intervention size as a FRACTION of the dataset.
# feature: frac x (#nodes of the label type); edge: frac x (#edges of core relation).
datasets: [finbench, eicu, snb, faers]
archs: [rgcn, hgat]
kinds: [feature, topo]
fracs: [0.05, 0.10, 0.15, 0.20, 0.30]
layers: [1, 2, 3, 4]
task: nodelabel
reps: 3
